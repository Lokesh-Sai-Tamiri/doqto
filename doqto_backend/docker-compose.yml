services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: doqto
      POSTGRES_PASSWORD: doqto
      POSTGRES_DB: doqto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doqto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Password matches REDIS_URL in .env. Prod must additionally use TLS
    # (rediss:// URL) — plain requirepass is only in-transit-auth, not encryption.
    command: ["redis-server", "--requirepass", "doqto-dev"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "doqto-dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
